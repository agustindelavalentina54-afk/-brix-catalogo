<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIX - Catálogo</title>
  <!-- Acá van tus estilos CSS (o podés ponerlos entre etiquetas <style> aquí mismo) -->
  <style>
    /* Pegá acá el CSS de las pestañas que te pasé antes */
  </style>
</head>
<body>

  <header>
    <div>
      <div>BRI<span>X</span></div>
    </div>
  </header>

  <main>
    <!-- SECCIÓN DE BIENVENIDA -->
    <section class="hero-section">
      <div class="hero-img">
        <img alt="BRIX - Tu momento, tu bebida" src="F7E36772-8F96-4024-8D1F-244561E45971.png">
      </div>
      
      <div class="hero-buttons">
        <button class="tab-btn" onclick="switchTabAndScroll(event, 'catalogo-tab')">VER CATÁLOGO</button>
        <a href="https://wa.me/5493512573455?text=Hola%20BRIX!%20Quiero%20hacer%20un%20pedido." rel="noopener" target="_blank">
          PEDIR POR WHATSAPP
        </a>
      </div>
    </section>

    <!-- BOTONES DE NAVEGACIÓN (Pestañas) -->
    <div class="tabs-container" id="seccion-pestañas">
      <button class="tab-btn active" onclick="switchTab(event, 'catalogo-tab')">Catálogo</button>
      <button class="tab-btn" onclick="switchTab(event, 'precios-tab')">Precios</button>
      <button class="tab-btn" onclick="switchTab(event, 'promos-tab')">Promos</button>
    </div>

    <!-- CONTENIDO 1: CATÁLOGO -->
    <div id="catalogo-tab" class="tab-content active-content">
      <h2>NUESTRO <span>CATÁLOGO</span></h2>
      <p>Elegí tu bebida BRIX.</p>
      <div class="grid-productos">
        <article>
          <img alt="Bebida BRIX 1" loading="lazy" src="IMG_3286.jpeg">
          <div>
            <h3>BRIX</h3>
            <p>Tu momento, tu bebida.</p>
          </div>
        </article>
        <!-- Agregá el resto de tus artículos acá -->
      </div>
    </div>

    <!-- CONTENIDO 2: PRECIOS -->
    <div id="precios-tab" class="tab-content">
      <h2>LISTA DE <span>PRECIOS</span></h2>
      <p>Conocé el valor de nuestras bebidas.</p>
      <div class="lista-precios">
        <div class="item-precio">
          <span>BRIX Clásica</span>
          <strong>$3.500</strong>
        </div>
      </div>
    </div>

    <!-- CONTENIDO 3: PROMOS -->
    <div id="promos-tab" class="tab-content">
      <h2><span>PROMOS</span> BRIX</h2>
      <p>Aprovechá nuestras promociones.</p>
      <div class="grid-promos">
        <div>
          <img alt="Promo BRIX 1" loading="lazy" src="IMG_3286.jpeg">
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 BRIX. Todos los derechos reservados.</p>
  </footer>

  <!-- SCRIPT DE JAVASCRIPT -->
  <script>
    function switchTab(evt, tabId) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active-content'));

      const buttons = document.querySelectorAll('.tabs-container .tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active-content');
      evt.currentTarget.classList.add('active');
    }

    function switchTabAndScroll(evt, tabId) {
      switchTab(evt, tabId);
      document.getElementById('seccion-pestañas').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
