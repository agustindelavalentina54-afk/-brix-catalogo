<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRIX Catálogo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f8;
  color:#20233d;
}

header{
  background:linear-gradient(135deg,#5427b8,#702fc4);
  color:white;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}

.cart{
  background:white;
  color:#5728b9;
  border:0;
  border-radius:12px;
  padding:10px 14px;
  font-size:18px;
  font-weight:bold;
}

.location{
  background:#dff3ff;
  color:#087ebc;
  padding:16px 20px;
  font-size:17px;
  font-weight:bold;
  text-align:center;
}

.hero{
  background:linear-gradient(135deg,#431b9d,#7136c9);
  color:white;
  padding:28px 20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  opacity:.9;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:15px;
  background:#fff;
}

.categories button{
  white-space:nowrap;
  border:2px solid #6330bd;
  color:#6330bd;
  background:white;
  border-radius:12px;
  padding:10px 16px;
  font-size:16px;
  font-weight:bold;
}

.categories button.active{
  background:#6330bd;
  color:white;
}

.products{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.section-title{
  font-size:25px;
  margin:15px 0;
}

.card{
  background:white;
  border-radius:16px;
  margin-bottom:15px;
  padding:12px;
  display:flex;
  gap:15px;
  align-items:center;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.product-img{
  width:105px;
  height:105px;
  border-radius:12px;
  background:linear-gradient(135deg,#420052,#9c006d);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:42px;
  flex-shrink:0;
}

.info{
  flex:1;
}

.info h3{
  font-size:18px;
  margin-bottom:8px;
}

.price{
  font-size:25px;
  font-weight:900;
  color:#171a34;
}

.old{
  color:#999;
  text-decoration:line-through;
  margin-left:7px;
  font-size:15px;
}

.discount{
  display:inline-block;
  margin-top:7px;
  background:#d9f5df;
  color:#13834e;
  padding:5px 9px;
  border-radius:20px;
  font-weight:bold;
  font-size:13px;
}

.add{
  margin-top:10px;
  border:0;
  background:#612bbd;
  color:white;
  padding:9px 13px;
  border-radius:9px;
  font-weight:bold;
}

.cart-panel{
  position:fixed;
  right:15px;
  bottom:15px;
  width:calc(100% - 30px);
  max-width:400px;
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 30px rgba(0,0,0,.25);
  z-index:30;
  display:none;
}

.cart-panel h2{
  margin-bottom:15px;
}

.cart-item{
  padding:8px 0;
  border-bottom:1px solid #ddd;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:15px 0;
}

.whatsapp{
  width:100%;
  border:0;
  background:#20b85a;
  color:white;
  padding:14px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:22px;
}

footer{
  background:#211631;
  color:white;
  text-align:center;
  padding:30px 20px;
  margin-top:30px;
}

@media(max-width:500px){
  .logo{
    font-size:25px;
  }

  .hero h1{
    font-size:27px;
  }

  .product-img{
    width:85px;
    height:85px;
  }

  .info h3{
    font-size:16px;
  }

  .price{
    font-size:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">BRIX</div>
    <button class="cart" onclick="toggleCart()">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>
</header>

<div class="location">
  📍 NUEVO LOCAL — QUEBRADA DEL CONDORITO 3673
</div>

<section class="hero">
  <h1>🍾 BRIX CATÁLOGO</h1>
  <p>Bebidas, combos y promociones</p>
</section>

<div class="categories">
  <button class="active" onclick="filterProducts('todos',this)">Todos</button>
  <button onclick="filterProducts('vodka',this)">Vodkas</button>
  <button onclick="filterProducts('fernet',this)">Fernet</button>
  <button onclick="filterProducts('energizante',this)">Energizantes</button>
  <button onclick="filterProducts('gaseosa',this)">Gaseosas</button>
  <button onclick="filterProducts('vino',this)">Vinos</button>
  <button onclick="filterProducts('combo',this)">Combos</button>
</div>

<main class="products">

<h2 class="section-title">Productos y promociones</h2>

<div id="productList"></div>

</main>

<div class="cart-panel" id="cartPanel">
  <button class="close" onclick="toggleCart()">✕</button>
  <h2>🛒 Mi pedido</h2>

  <div id="cartItems"></div>

  <div class="total">
    Total: $<span id="total">0</span>
  </div>

  <button class="whatsapp" onclick="sendWhatsApp()">
    📲 Enviar pedido por WhatsApp
  </button>
</div>

<footer>
  <h2>BRIX</h2>
  <p>📍 Quebrada del Condorito 3673</p>
  <p style="margin-top:8px;">Catálogo online</p>
</footer>

let cart=[];

function money(value){
 return value.toLocaleString("es-AR");
}

function renderProducts(list=products){

 const container=document.getElementById("productList");

 container.innerHTML="";

 list.forEach((product,index)=>{

   container.innerHTML+=`

   <div class="card">

     <div class="product-img">
       ${product.emoji}
     </div>

     <div class="info">

       <h3>${product.name}</h3>

       <div class="price">
         $${money(product.price)}
       </div>

       <button class="add" onclick="addToCart(${index})">
         + Agregar al pedido
       </button>

     </div>

   </div>

   `;

 });

}

function filterProducts(category,button){

 document.querySelectorAll(".categories button")
 .forEach(btn=>btn.classList.remove("active"));

 button.classList.add("active");

 if(category==="todos"){
   renderProducts(products);
 }else{
   renderProducts(
     products.filter(product=>product.category===category)
   );
 }

}

function addToCart(index){

 cart.push(products[index]);

 updateCart();

}

function updateCart(){

 document.getElementById("cartCount").innerText=cart.length;

 let html="";
 let total=0;

 cart.forEach((item,index)=>{

   total+=item.price;

   html+=`
   <div class="cart-item">
     ${item.name} — $${money(item.price)}
   </div>
   `;

 });

 document.getElementById("cartItems").innerHTML=
 cart.length ? html : "<p>Tu pedido está vacío.</p>";

 document.getElementById("total").innerText=money(total);

}

function toggleCart(){

 const panel=document.getElementById("cartPanel");

 panel.style.display=
 panel.style.display==="block" ? "none" : "block";

}

function sendWhatsApp(){

 if(cart.length===0){

   alert("Agregá algún producto al pedido.");

   return;
 }

 let message="Hola! Quiero hacer este pedido:%0A%0A";

 let total=0;

 cart.forEach(item=>{

   message+="• "+item.name+
   " — $"+money(item.price)+"%0A";

   total+=item.price;

 });

 message+="%0A*Total: $"+money(total)+"*";

 /*
  Reemplazá los números de abajo por el WhatsApp
  de tu emprendimiento.
 */

 const phone="5493510000000";

 window.open(
   "https://wa.me/"+phone+"?text="+message,
   "_blank"
 );

}

renderProducts();
updateCart();

</html>
