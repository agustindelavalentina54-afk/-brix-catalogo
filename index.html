<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIX - Catálogo de Bebidas</title>
  <style>
    /* ESTILOS GENERALES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #fff;
    }

    /* HEADER Y MENÚ HAMBURGUESA */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(13, 13, 13, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      z-index: 1000;
      border-bottom: 1px solid #222;
      backdrop-filter: blur(5px);
    }

    .menu-toggle {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
    }

    .logo-text {
      font-weight: bold;
      font-size: 1.3rem;
      letter-spacing: 2px;
    }
    .logo-text span {
      color: #25d366; /* La X en verde como pediste */
    }

    /* MENÚ LATERAL (SIDEBAR) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background-color: #161616;
      box-shadow: 4px 0 15px rgba(0,0,0,0.7);
      transition: left 0.3s ease;
      z-index: 1100;
      padding-top: 70px;
      overflow-y: auto;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      position: absolute;
      top: 15px;
      right: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li button {
      width: 100%;
      background: none;
      border: none;
      color: #bbb;
      text-align: left;
      padding: 15px 25px;
      font-size: 1.05rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
