<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BRIX | Catálogo</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f4f8;
  color:#211b35;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:linear-gradient(135deg,#42168f,#7d28c9);
  padding:15px 18px;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:36px;
  font-weight:1000;
  letter-spacing:4px;

  background:linear-gradient(
    90deg,
    #ffffff,
    #e9c8ff,
    #ffffff
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:0 2px 15px rgba(255,255,255,.25);
}

.cart{
  border:0;
  background:white;
  color:#6322ad;
  border-radius:13px;
  padding:10px 15px;
  font-size:19px;
  font-weight:bold;
}

/* UBICACION */

.location{
  background:#e1f5ff;
  color:#0878ad;
  text-align:center;
  padding:14px 12px;
  font-size:15px;
  font-weight:bold;
}

/* HERO */

.hero{
  padding:35px 20px;
  color:white;

  background:
  radial-gradient(circle at top right,#a94ce5,transparent 35%),
  linear-gradient(135deg,#351070,#7526c4);
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  font-size:17px;
  opacity:.92;
}

/* CATEGORIAS */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:14px;
  background:white;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories button{
  white-space:nowrap;
  border:2px solid #6726b6;
  background:white;
  color:#6726b6;
  border-radius:12px;
  padding:10px 15px;
  font-size:15px;
  font-weight:bold;
}

.categories button.active{
  background:#6726b6;
  color:white;
}

/* PRODUCTOS */

.products{
  max-width:950px;
  margin:auto;
  padding:15px;
}

.section-title{
  font-size:25px;
  margin:10px 0 18px;
}

/* TARJETA */

.card{
  background:white;
  border-radius:18px;
  margin-bottom:15px;
  padding:12px;

  display:flex;
  align-items:center;
  gap:14px;

  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product-img{
  width:105px;
  height:105px;

  flex-shrink:0;

  border-radius:15px;

  background:
  linear-gradient(135deg,#381052,#9c2fc5);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  color:white;
  font-size:43px;
}

.product-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  flex:1;
}

.info h3{
  font-size:17px;
  margin-bottom:7px;
}

.price{
  font-size:24px;
  font-weight:900;
}

.add{
  margin-top:9px;

  border:0;
  background:#6524b8;
  color:white;

  padding:10px 13px;

  border-radius:10px;

  font-size:14px;
  font-weight:bold;
}

.add:active{
  transform:scale(.96);
}

/* PROMO */

.promo{
  border:2px solid #7a32c7;

  background:
  linear-gradient(
    135deg,
    #fff,
    #f6edff
  );
}

.promo .product-img{
  background:
  linear-gradient(135deg,#7a179e,#e32e9b);
}

.promo-label{
  display:inline-block;

  background:#dcf7e4;
  color:#118247;

  padding:4px 8px;

  border-radius:20px;

  font-size:12px;
  font-weight:bold;

  margin-bottom:5px;
}

/* CARRITO */

.cart-panel{
  position:fixed;

  left:15px;
  right:15px;
  bottom:15px;

  max-width:450px;
  margin:auto;

  background:white;

  border-radius:20px;

  padding:20px;

  box-shadow:0 5px 35px rgba(0,0,0,.3);

  z-index:200;

  display:none;

  max-height:75vh;
  overflow-y:auto;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:15px;
}

.close{
  border:0;
  background:#eee;

  width:35px;
  height:35px;

  border-radius:50%;

  font-size:20px;
}

.cart-item{
  padding:10px 0;

  border-bottom:1px solid #ddd;

  font-size:14px;
}

.total{
  font-size:23px;
  font-weight:900;

  margin:18px 0;
}

.whatsapp{
  width:100%;

  border:0;

  background:#20b85a;
  color:white;

  padding:15px;

  border-radius:12px;

  font-size:17px;
  font-weight:bold;
}

/* FOOTER */

footer{
  margin-top:30px;

  background:#21132f;
  color:white;

  text-align:center;

  padding:35px 20px;
}

footer h2{
  font-size:30px;
  letter-spacing:4px;

  margin-bottom:12px;
}

footer p{
  opacity:.85;
  margin-top:6px;
}

/* CELULAR */

@media(max-width:500px){

  .logo{
    font-size:29px;
  }

  .hero h1{
    font-size:28px;
  }

  .product-img{
    width:88px;
    height:88px;
  }

  .info h3{
    font-size:15px;
  }

  .price{
    font-size:21px;
  }

  .add{
    font-size:13px;
  }

}

</style>
</head>

<main class="products">

<!-- CARRITO -->

<div

      ✕
    </button>

  </div>

  <div id="cartItems"></div>

  <div class="total">

  <button
    class="whatsapp"
    onclick="sendWhatsApp()">

    📲 Enviar pedido por WhatsApp

</div>


<footer>

  <h2>BRIX</h2>

  <p>
    📍 Quebrada del Condorito 3673

  <p>
    Catálogo online

let cart=[];


/* =========================
   DINERO
========================= */

function money(value){

 return value.toLocaleString("es-AR");

}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function renderProducts(list=products){

 const container =
 document.getElementById("productList");

 container.innerHTML="";


 list.forEach(product=>{

   const cardClass =
   product.promo
   ? "card promo"
   : "card";


   container.innerHTML += `

   <div class="${cardClass}">

      <div class="product-img">

        ${
          product.image
          ?
          `<img src="${product.image}"
          alt="${product.name}">`
          :
          product.emoji
        }

      </div>


      <div class="info">

        ${
          product.promo
          ?
          `<span class="promo-label">
             🔥 PROMOCIÓN
           </span>`
          :
          ""
        }

        <h3>
          ${product.name}
        </h3>

        <div class="price">
          $${money(product.price)}
        </div>

        <button
          class="add"
          onclick="addToCart(${product.id})">

          + Agregar al pedido

        </button>

      </div>

   </div>

   `;

 });

}


/* =========================
   FILTROS
========================= */

function filterProducts(category,button){

 document
 .querySelectorAll(".categories button")
 .forEach(btn=>{
   btn.classList.remove("active");
 });

 button.classList.add("active");


 if(category==="todos"){

   renderProducts(products);

 }else{

   renderProducts(
     products.filter(
       product =>
       product.category===category
     )
   );

 }

}


/* =========================
   AGREGAR
========================= */

function addToCart(id){

 const product =
 products.find(
   product => product.id===id
 );

 if(!product) return;

 cart.push(product);

 updateCart();

}


/* =========================
   ACTUALIZAR CARRITO
========================= */

function updateCart(){

 document
 .getElementById("cartCount")
 .innerText=cart.length;


 let html="";
 let total=0;


 cart.forEach((item,index)=>{

   total += item.price;

   html += `

   <div class="cart-item">

     ${item.name}

     — $${money(item.price)}

   </div>

   `;

 });


 document
 .getElementById("cartItems")
 .innerHTML =

 cart.length
 ?
 html
 :
 "<p>Tu pedido está vacío.</p>";


 document
 .getElementById("total")
 .innerText=money(total);

}


/* =========================
   ABRIR CARRITO
========================= */

function toggleCart(){

 const panel =
 document.getElementById("cartPanel");


 panel.style.display =

 panel.style.display==="block"
 ?
 "none"
 :
 "block";

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

 if(cart.length===0){

   alert(
     "Agregá algún producto al pedido."
   );

   return;

 }


 let message =
 "Hola! Quiero hacer este pedido:\n\n";


 let total=0;


 cart.forEach(item=>{

   message +=
   "• "+
   item.name+
   " — $"+
   money(item.price)+
   "\n";

   total += item.price;

 });


 message +=
 "\nTotal: $"+
 money(total);


 /*
 ==============================
 CAMBIÁ ESTE NÚMERO
 POR EL WHATSAPP DE BRIX
 ==============================
 */

 const phone =
 "5493510000000";


 const url =
 "https://wa.me/"+
 phone+
 "?text="+
 encodeURIComponent(message);


 window.open(
   url,
   "_blank"
 );

}

   INICIAR
========================= */
