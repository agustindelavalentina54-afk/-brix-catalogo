<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BRIX | Catálogo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

:root{
  --negro:#111111;
  --negro2:#1c1c1c;
  --blanco:#ffffff;
  --gris:#f3f3f3;
  --verde:#18b957;
  --verde-oscuro:#0d8f43;
}

body{
  background:var(--gris);
  color:var(--negro);
}

/* HEADER */

header{
  background:var(--negro);
  color:white;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 15px rgba(0,0,0,.25);
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:900px;
  margin:auto;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--verde);
}

.cart{
  background:var(--verde);
  color:white;
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

/* UBICACIÓN */

.location{
  background:var(--verde);
  color:white;
  padding:13px 20px;
  font-size:16px;
  font-weight:bold;
  text-align:center;
}

/* HERO */

.hero{
  background:var(--negro);
  color:white;
  padding:32px 20px;
  text-align:center;
}

.hero h1{
  font-size:36px;
  margin-bottom:8px;
  color:var(--verde);
  letter-spacing:2px;
}

.hero p{
  color:#ddd;
  font-size:17px;
}

/* CATEGORÍAS */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:15px;
  background:white;
  border-bottom:1px solid #ddd;
}

.categories button{
  white-space:nowrap;
  border:2px solid var(--verde);
  color:var(--verde-oscuro);
  background:white;
  border-radius:12px;
  padding:10px 16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.categories button.active{
  background:var(--verde);
  color:white;
}

/* PRODUCTOS */

.products{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.section-title{
  font-size:25px;
  margin:15px 0;
}

/* TARJETA */

.card{
  background:white;
  border-radius:16px;
  margin-bottom:15px;
  padding:13px;
  display:flex;
  gap:15px;
  align-items:center;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  border-left:5px solid var(--verde);
}

.product-img{
  width:105px;
  height:105px;
  border-radius:12px;
  background:var(--negro);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:42px;
  flex-shrink:0;
}

.info{
  flex:1;
}

.info h3{
  font-size:18px;
  margin-bottom:8px;
  line-height:1.2;
}

.price{
  font-size:25px;
  font-weight:900;
  color:var(--verde-oscuro);
}

.add{
  margin-top:10px;
  border:0;
  background:var(--verde);
  color:white;
  padding:10px 13px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.add:active{
  transform:scale(.97);
}

/* CARRITO */

.cart-panel{
  position:fixed;
  right:15px;
  bottom:15px;
  width:calc(100% - 30px);
  max-width:420px;
  max-height:80vh;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 30px rgba(0,0,0,.35);
  z-index:30;
  display:none;
  border-top:6px solid var(--verde);
}

.cart-panel h2{
  margin-bottom:15px;
}

.cart-item{
  padding:10px 0;
  border-bottom:1px solid #ddd;
  font-size:15px;
}

.remove{
  float:right;
  border:0;
  background:#eee;
  color:#111;
  border-radius:6px;
  padding:3px 7px;
  cursor:pointer;
}

.total{
  font-size:23px;
  font-weight:bold;
  margin:18px 0;
}

.whatsapp{
  width:100%;
  border:0;
  background:var(--verde);
  color:white;
  padding:14px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
}

/* FOOTER */

footer{
  background:var(--negro);
  color:white;
  text-align:center;
  padding:30px 20px;
  margin-top:30px;
}

footer h2{
  color:var(--verde);
  font-size:30px;
  margin-bottom:10px;
}

/* CELULAR */

@media(max-width:500px){

  .logo{
    font-size:27px;
  }

  .hero h1{
    font-size:30px;
  }

  .product-img{
    width:85px;
    height:85px;
    font-size:34px;
  }

  .info h3{
    font-size:16px;
  }

  .price{
    font-size:21px;
  }

  .add{
    font-size:13px;
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="logo">
      BRIX
    </div>

    <button class="cart" onclick="toggleCart()">
      🛒 <span id="cartCount">0</span>
    </button>

  </div>

</header>


<div class="location">
  📍 QUEBRADA DEL CONDORITO 3673
</div>


<section class="hero">

  <h1>BRIX</h1>

    Tu momento, tu bebida.

</section>


<div class="categories">

  <button class="active"
  onclick="filterProducts('todos',this)">

  <button onclick="filterProducts('vodka',this)">

  <button onclick="filterProducts('fernet',this)">

  <button onclick="filterProducts('energizante',this)">

  <button onclick="filterProducts('gaseosa',this)">

  <button onclick="filterProducts('vino',this)">

  <button onclick="filterProducts('combo',this)">
    Combos

</div>


<main class="products">

  <h2 class="section-title">
    Productos y promociones
  </h2>

  <div id="productList"></div>

</main>


<!-- CARRITO -->

<div class="cart-panel" id="cartPanel">

  <button class="close" onclick="toggleCart()">
    ✕
  </button>

  <h2>
    🛒 Mi pedido
  </h2>

  <div id="cartItems"></div>

  <div class="total">
    Total: $<span id="total">0</span>
  </div>

  <button class="whatsapp" onclick="sendWhatsApp()">
    📲 Enviar pedido por WhatsApp
  </button>

</div>


<footer>

  <h2>BRIX</h2>

  <p>
    📍 Quebrada del Condorito 3673
  </p>

  <p style="margin-top:8px;">
    Tu momento, tu bebida.
  </p>

</footer>

];


let cart=[];


/* FORMATO DE DINERO */

function money(value){

 return value.toLocaleString("es-AR");

}


/* MOSTRAR PRODUCTOS */

function renderProducts(list=products){

 const container=document.getElementById("productList");

 container.innerHTML="";

 list.forEach((product)=>{

   const originalIndex=products.indexOf(product);

   container.innerHTML+=`

   <div class="card">

     <div class="product-img">
       ${product.emoji}
     </div>

     <div class="info">

       <h3>
         ${product.name}
       </h3>

       <div class="price">
         $${money(product.price)}
       </div>

       <button class="add"
       onclick="addToCart(${originalIndex})">

         + Agregar al pedido

       </button>

     </div>

   </div>

   `;

 });

}


/* FILTRAR */

function filterProducts(category,button){

 document.querySelectorAll(".categories button")
 .forEach(btn=>btn.classList.remove("active"));

 button.classList.add("active");


 if(category==="todos"){

   renderProducts(products);

 }else{

   renderProducts(
     products.filter(
       product=>product.category===category
     )
   );

 }

}


/* AGREGAR AL CARRITO */

function addToCart(index){

 cart.push(products[index]);

 updateCart();

}


/* ACTUALIZAR CARRITO */

function updateCart(){

 document.getElementById("cartCount").innerText=cart.length;

 let html="";
 let total=0;


 cart.forEach((item,index)=>{

   total+=item.price;

   html+=`

   <div class="cart-item">

     ${item.name}

     <br>

     <strong>
       $${money(item.price)}
     </strong>

     <button
       class="remove"
       onclick="removeFromCart(${index})">

       ✕

     </button>

   </div>

   `;

 });


 document.getElementById("cartItems").innerHTML=

 cart.length

 ? html

 : "<p>Tu pedido está vacío.</p>";


 document.getElementById("total").innerText=
 money(total);

}


/* ELIMINAR DEL CARRITO */

function removeFromCart(index){

 cart.splice(index,1);

 updateCart();

}


/* ABRIR / CERRAR CARRITO */

function toggleCart(){

 const panel=
 document.getElementById("cartPanel");


 panel.style.display=

 panel.style.display==="block"

 ? "none"

 : "block";

}


/* WHATSAPP */

function sendWhatsApp(){

 if(cart.length===0){

   alert("Agregá algún producto al pedido.");

   return;

 }


 let message=
 "Hola! Quiero hacer este pedido:%0A%0A";


 let total=0;


 cart.forEach(item=>{

   message+=
   "• "+item.name+
   " — $"+money(item.price)+
   "%0A";

   total+=item.price;

 });


 message+=
 "%0A*Total: $"+
 money(total)+
 "*";


 /*
  IMPORTANTE:
  CAMBIÁ ESTE NÚMERO POR EL WHATSAPP
  REAL DE BRIX.

  Formato:
  549 + código de área + número

  Ejemplo Córdoba:
  549351XXXXXXXX
 */


 const phone="5493510000000";


 window.open(
   "https://wa.me/"+
   phone+
   "?text="+
   message,
   "_blank"
 );

}


/* INICIAR */

renderProducts();

updateCart();

</script>
